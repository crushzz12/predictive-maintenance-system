[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-system"
version = "0.1.0"
description = "Machine condition monitoring and predictive maintenance system"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]