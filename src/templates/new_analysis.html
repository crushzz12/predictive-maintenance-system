{% extends "layout.html" %}

{% block page_title %}
    New vibration analysis
{% endblock %}

{% block main %}
    <p>
        <a href="{{ url_for('machine_detail', machine_id=machine['id']) }}">
            &#8592; Back to {{ machine["name"] }}
        </a>
    </p>

    <div class="panel form-panel">
        <h2>{{ machine["name"] }}</h2>
        <form method="post" enctype="multipart/form-data">
            <label>Vibration file</label>
            <input type="file" name="file" accept=".mat" required>
            <label>Sampling rate</label>
            <input type="number" name="sampling_rate" value="48000" min="1" required>
            <label>Window duration (seconds)</label>
            <input type="number" name="window_duration" value="1.0" step="0.1" min="0.1" required>
            <label>RPM override</label>
            <input type="number" name="rpm" step="0.1" placeholder="Leave blank if file contains RPM">
            <button class="button button-primary" type="submit">Analyze recording</button>
        </form>
    </div>
{% endblock %}
